<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2" />
      <stop offset="50%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="g16" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#mainBg)" />
  
  <rect x="66" y="60" width="380" height="300" rx="30" fill="#ffffff" fill-opacity="0.05" />

  <g filter="url(#shadow)">
    <rect x="96" y="90" width="150" height="110" rx="18" fill="url(#g2)" />
    <rect x="96" y="90" width="150" height="110" rx="18" fill="url(#shine)" />
    <text x="171" y="165" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, sans-serif" font-size="56" font-weight="900" fill="white">2</text>

    <rect x="266" y="90" width="150" height="110" rx="18" fill="url(#g4)" />
    <rect x="266" y="90" width="150" height="110" rx="18" fill="url(#shine)" />
    <text x="341" y="165" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, sans-serif" font-size="56" font-weight="900" fill="white">4</text>

    <rect x="96" y="220" width="150" height="110" rx="18" fill="url(#g8)" />
    <rect x="96" y="220" width="150" height="110" rx="18" fill="url(#shine)" />
    <text x="171" y="295" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, sans-serif" font-size="56" font-weight="900" fill="white">8</text>

    <rect x="266" y="220" width="150" height="110" rx="18" fill="url(#g16)" />
    <rect x="266" y="220" width="150" height="110" rx="18" fill="url(#shine)" />
    <text x="341" y="295" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, sans-serif" font-size="48" font-weight="900" fill="white">16</text>
  </g>

  <text x="256" y="460" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, sans-serif" font-size="100" font-weight="900" fill="white" filter="url(#glow)">2048</text>
  
  <rect x="2" y="2" width="508" height="508" rx="98" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="4" />
</svg>
